name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build backend
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: pnpm --filter @workspace/shop-ledger run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          echo "Host shop-ledger.online" >> ~/.ssh/config
          echo "  Port 65002" >> ~/.ssh/config
          echo "  User u412659001" >> ~/.ssh/config
          echo "  IdentityFile ~/.ssh/id_rsa" >> ~/.ssh/config
          echo "  StrictHostKeyChecking no" >> ~/.ssh/config
          echo "  UserKnownHostsFile /dev/null" >> ~/.ssh/config
          chmod 600 ~/.ssh/config

      - name: Deploy backend dist
        run: |
          rsync -az --delete -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            artifacts/api-server/dist/ \
            u412659001@shop-ledger.online:/home/u412659001/domains/shop-ledger.online/nodejs/artifacts/api-server/dist/

      - name: Deploy frontend dist
        run: |
          rsync -az --delete -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            artifacts/shop-ledger/dist/ \
            u412659001@shop-ledger.online:/home/u412659001/domains/shop-ledger.online/public_html/

      - name: Deploy entry file
        run: |
          rsync -az -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            index.js \
            u412659001@shop-ledger.online:/home/u412659001/domains/shop-ledger.online/nodejs/index.js

      - name: Restart server
        run: |
          ssh -p 65002 -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            u412659001@shop-ledger.online \
            "
            APP_DIR=/home/u412659001/domains/shop-ledger.online/nodejs
            # Touch restart file (LiteSpeed/Passenger style restart)
            mkdir -p \$APP_DIR/tmp && touch \$APP_DIR/tmp/restart.txt
            # Also send SIGUSR1 (graceful reload) to lsnode if running
            PID=\$(ps aux | grep lsnode | grep -v grep | awk '{print \$1}' | head -1)
            if [ -n \"\$PID\" ]; then
              kill -USR1 \$PID 2>/dev/null && echo 'Sent graceful reload signal'
            else
              echo 'lsnode not found, LiteSpeed will start it on next request'
            fi
            echo 'Deploy complete'
            "
# Auto-deploy enabled via GitHub Actions
