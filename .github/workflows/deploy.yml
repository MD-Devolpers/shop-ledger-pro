name: Build & Deploy to Hostinger

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile

      - name: Build backend
        run: pnpm --filter @workspace/api-server run build

      - name: Build frontend
        run: pnpm --filter @workspace/shop-ledger run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.HOSTINGER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          cat >> ~/.ssh/config <<EOF
          Host hostinger
            HostName shop-ledger.online
            Port 65002
            User u412659001
            IdentityFile ~/.ssh/id_rsa
            StrictHostKeyChecking no
            UserKnownHostsFile /dev/null
          EOF
          chmod 600 ~/.ssh/config

      - name: Deploy backend dist
        run: |
          rsync -az --delete -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            artifacts/api-server/dist/ \
            u412659001@shop-ledger.online:/home/u412659001/domains/shop-ledger.online/nodejs/artifacts/api-server/dist/

      - name: Deploy frontend to nodejs dir (Node.js serves this in production)
        run: |
          rsync -az --delete -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            artifacts/shop-ledger/dist/public/ \
            u412659001@shop-ledger.online:/home/u412659001/domains/shop-ledger.online/nodejs/artifacts/shop-ledger/dist/public/

      - name: Deploy frontend to public_html (preserves .htaccess)
        run: |
          rsync -az --delete --exclude='.htaccess' -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            artifacts/shop-ledger/dist/public/ \
            u412659001@shop-ledger.online:/home/u412659001/domains/shop-ledger.online/public_html/

      - name: Deploy .htaccess (Passenger config for Node.js routing)
        run: |
          rsync -az -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            hostinger/.htaccess \
            u412659001@shop-ledger.online:/home/u412659001/domains/shop-ledger.online/public_html/.htaccess

      - name: Deploy entry file
        run: |
          rsync -az -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            index.js \
            u412659001@shop-ledger.online:/home/u412659001/domains/shop-ledger.online/nodejs/index.js

      - name: Deploy .env to Hostinger
        run: |
          cat > /tmp/deploy.env << 'ENVEOF'
          DATABASE_URL=PLACEHOLDER_DB
          SESSION_SECRET=PLACEHOLDER_SS
          GMAIL_USER=PLACEHOLDER_GU
          GMAIL_APP_PASSWORD=PLACEHOLDER_GP
          RESTART_TOKEN=PLACEHOLDER_RT
          NODE_ENV=production
          COOKIE_SECURE=true
          ENVEOF
          # Write clean .env with actual values (no leading spaces)
          printf 'DATABASE_URL=%s\n' '${{ secrets.DATABASE_URL }}' > /tmp/deploy.env
          printf 'SESSION_SECRET=%s\n' '${{ secrets.SESSION_SECRET }}' >> /tmp/deploy.env
          printf 'GMAIL_USER=%s\n' '${{ secrets.GMAIL_USER }}' >> /tmp/deploy.env
          printf 'GMAIL_APP_PASSWORD=%s\n' '${{ secrets.GMAIL_APP_PASSWORD }}' >> /tmp/deploy.env
          printf 'RESTART_TOKEN=%s\n' '${{ secrets.RESTART_TOKEN }}' >> /tmp/deploy.env
          printf 'NODE_ENV=production\n' >> /tmp/deploy.env
          printf 'COOKIE_SECURE=true\n' >> /tmp/deploy.env
          rsync -az -e "ssh -p 65002 -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null" \
            /tmp/deploy.env \
            u412659001@shop-ledger.online:/home/u412659001/domains/shop-ledger.online/nodejs/.env
          echo "Deployed .env successfully"

      - name: Diagnose Hostinger Node.js environment
        run: |
          ssh hostinger '
            echo "=== which node ==="
            which node 2>/dev/null || echo "not in PATH"
            echo "=== find node binaries ==="
            find /usr /opt /home/u412659001 -name "node" -type f 2>/dev/null | grep -v node_modules | head -10 || true
            echo "=== nvm check ==="
            ls ~/.nvm/versions/node/ 2>/dev/null || echo "no nvm"
            echo "=== lsnode check ==="
            ls /usr/local/lsws/lsnode*/bin/ 2>/dev/null || echo "no lsnode"
            echo "=== .env contents (keys only) ==="
            grep -oP "^[^=]+" /home/u412659001/domains/shop-ledger.online/nodejs/.env 2>/dev/null || echo "no .env"
            echo "=== passenger log ==="
            tail -20 /home/u412659001/domains/shop-ledger.online/logs/passenger.*.log 2>/dev/null | head -30 || echo "no passenger log"
            echo "=== stderr log ==="
            tail -20 /home/u412659001/domains/shop-ledger.online/logs/stderr.log 2>/dev/null || echo "no stderr log"
          '

      - name: Restart server (Hostinger touch mechanism)
        run: |
          ssh hostinger "mkdir -p /home/u412659001/domains/shop-ledger.online/nodejs/tmp && \
            touch /home/u412659001/domains/shop-ledger.online/nodejs/tmp/restart.txt"
          echo "Server restart triggered"
