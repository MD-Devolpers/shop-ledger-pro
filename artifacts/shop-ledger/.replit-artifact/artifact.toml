kind = "web"
previewPath = "/"
title = "Daily Shop Ledger"
description = "A full-stack shop ledger app for tracking daily Cash In, Cash Out, Credits, Profits, Reports, and Admin management. Built for shopkeepers to manage their daily business transactions."
version = "1.0.0"
id = "artifacts/shop-ledger"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 20981

[services.development]
run = "pnpm --filter @workspace/shop-ledger run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/shop-ledger", "run", "build" ]
serve = "static"
publicDir = "artifacts/shop-ledger/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "20981"
BASE_PATH = "/"
